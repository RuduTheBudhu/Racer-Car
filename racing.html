
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Turbo Racer 🏎️</title>
<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  background: #10131f;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
}

h1 {
  color: #00f5ff;
  margin: 16px 0 5px;
  text-shadow: 0 0 12px #00f5ff;
}

p { margin: 8px; color: #cbd5e1; }

.hud {
  display: flex;
  justify-content: center;
  gap: 30px;
  margin: 12px;
  font-size: 18px;
  font-weight: bold;
}

.hud span { color: #ffe600; }

.game {
  position: relative;
  width: min(95vw, 400px);
  margin: auto;
}

canvas {
  display: block;
  width: 100%;
  border: 3px solid #00f5ff;
  border-radius: 8px;
  background: #333;
  box-shadow: 0 0 20px #00f5ff55;
}

#overlay {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: #090d20d9;
  border-radius: 8px;
  padding: 20px;
}

#overlay h2 {
  color: #ffe600;
  font-size: 32px;
}

button {
  border: none;
  border-radius: 10px;
  padding: 13px 22px;
  margin: 7px;
  background: #00f5ff;
  color: #10131f;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
  touch-action: manipulation;
}

button:hover { background: #ffe600; }

.controls {
  display: flex;
  justify-content: center;
  gap: 35px;
  margin: 12px;
}

.controls button {
  width: 100px;
  font-size: 25px;
}

.small {
  font-size: 13px;
  color: #9ca3af;
}
</style>
</head>
<body>

<h1>🏎️ TURBO RACER</h1>
<p>Dodge the traffic. Beat your high score!</p>

<div class="hud">
  <div>🏆 Score: <span id="score">0</span></div>
  <div>⚡ Speed: <span id="speed">1</span></div>
</div>

<div class="game">
  <canvas id="canvas" width="400" height="600"></canvas>

  <div id="overlay">
    <h2 id="message">TURBO RACER</h2>
    <p id="instructions">
      Avoid the enemy cars and survive!<br><br>
      Use ← → or A / D to steer.
    </p>
    <button id="start">▶ START RACE</button>
  </div>
</div>

<div class="controls">
  <button id="left">⬅ LEFT</button>
  <button id="right">RIGHT ➡</button>
</div>

<p class="small">Tip: Avoid the red cars. The longer you survive, the faster it gets!</p>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const scoreEl = document.getElementById("score");
const speedEl = document.getElementById("speed");
const overlay = document.getElementById("overlay");
const message = document.getElementById("message");
const instructions = document.getElementById("instructions");
const startBtn = document.getElementById("start");

const W = canvas.width;
const H = canvas.height;

const road = { x: 45, width: 310 };
const laneWidth = road.width / 3;

let player, enemies, score, speed, roadOffset;
let running = false;
let lastTime = 0;
let spawnTimer = 0;
let animationId = 0;
let keys = { left: false, right: false };

function resetGame() {
  player = { x: W / 2 - 23, y: H - 115, w: 46, h: 76 };
  enemies = [];
  score = 0;
  speed = 5;
  roadOffset = 0;
  spawnTimer = 0;
  scoreEl.textContent = "0";
  speedEl.textContent = "1";
}

function roundedRect(x, y, w, h, r, color) {
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.roundRect(x, y, w, h, r);
  ctx.fill();
}

function drawCar(car, color, isPlayer = false) {
  const { x, y, w, h } = car;

  // Wheels
  roundedRect(x - 4, y + 13, 8, 19, 3, "#111");
  roundedRect(x + w - 4, y + 13, 8, 19, 3, "#111");
  roundedRect(x - 4, y + h - 32, 8, 19, 3, "#111");
  roundedRect(x + w - 4, y + h - 32, 8, 19, 3, "#111");

  // Body
  roundedRect(x, y, w, h, 11, color);

  // Windows
  roundedRect(x + 7, y + 15, w - 14, 19, 5, "#a5e9ff");
  roundedRect(x + 8, y + 42, w - 16, 13, 4, "#20344c");

  // Racing stripe
  if (isPlayer) {
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(x + w / 2 - 2, y + 3, 4, h - 6);
  }

  // Lights
  roundedRect(x + 4, y + 3, 10, 5, 2, "#fff5b0");
  roundedRect(x + w - 14, y + 3, 10, 5, 2, "#fff5b0");
  roundedRect(x + 4, y + h - 7, 10, 4, 2, "#ff3030");
  roundedRect(x + w - 14, y + h - 7, 10, 4, 2, "#ff3030");
}

function drawRoad() {
  ctx.fillStyle = "#237a36";
  ctx.fillRect(0, 0, W, H);

  // Road surface
  ctx.fillStyle = "#30343c";
  ctx.fillRect(road.x, 0, road.width, H);

  // Road edges
  ctx.fillStyle = "#ffffff";
  ctx.fillRect(road.x - 5, 0, 5, H);
  ctx.fillRect(road.x + road.width, 0, 5, H);

  // Red-and-white roadside markers
  for (let y = -40 + (roadOffset % 80); y < H; y += 80) {
    ctx.fillStyle = "#ff4040";
    ctx.fillRect(road.x - 12, y, 7, 35);
    ctx.fillRect(road.x + road.width + 5, y, 7, 35);
  }

  // Lane markings
  ctx.fillStyle = "#eeeeee";
  for (let lane = 1; lane <= 2; lane++) {
    const x = road.x + lane * laneWidth - 2;
    for (let y = -60 + (roadOffset % 60); y < H; y += 60) {
      ctx.fillRect(x, y, 4, 32);
    }
  }
}

function spawnEnemy() {
  const lane = Math.floor(Math.random() * 3);
  const colors = ["#ff3434", "#ff9f1c", "#c64dff", "#f4f4f4"];

  enemies.push({
    x: road.x + lane * laneWidth + laneWidth / 2 - 22,
    y: -90,
    w: 44,
    h: 72,
    color: colors[Math.floor(Math.random() * colors.length)],
    passed: false
  });
}

function collides(a, b) {
  // Slightly forgiving collision box
  return (
    a.x + 7 < b.x + b.w - 5 &&
    a.x + a.w - 7 > b.x + 5 &&
    a.y + 9 < b.y + b.h - 5 &&
    a.y + a.h - 7 > b.y + 5
  );
}

function draw() {
  drawRoad();

  enemies.forEach(car => drawCar(car, car.color));
  drawCar(player, "#00cfff", true);
}

function gameOver() {
  running = false;
  keys.left = false;
  keys.right = false;

  message.textContent = "💥 GAME OVER!";
  instructions.innerHTML =
    "Final score: " + score +
    "<br><br>Think you can beat it?";

  startBtn.textContent = "🔄 RACE AGAIN";
  overlay.style.display = "flex";
}

function loop(time) {
  if (!running) return;

  const dt = Math.min((time - lastTime) / 16.67 || 1, 2);
  lastTime = time;

  speed = Math.min(5 + score / 150, 13);
  roadOffset += speed * dt;

  // Steering
  const moveSpeed = 6.5 * dt;
  if (keys.left) player.x -= moveSpeed;
  if (keys.right) player.x += moveSpeed;

  player.x = Math.max(
    road.x + 5,
    Math.min(road.x + road.width - player.w - 5, player.x)
  );

  // Spawn traffic
  spawnTimer += dt;
  const spawnInterval = Math.max(34, 80 - score / 15);

  if (spawnTimer > spawnInterval) {
    spawnEnemy();
    spawnTimer = 0;
  }

  // Move enemy cars
  for (let i = enemies.length - 1; i >= 0; i--) {
    const car = enemies[i];
    car.y += (speed + 2) * dt;

    if (collides(player, car)) {
      draw();
      gameOver();
      return;
    }

    if (!car.passed && car.y > player.y + player.h) {
      car.passed = true;
      score += 10;
    }

    if (car.y > H + 100) {
      enemies.splice(i, 1);
    }
  }

  scoreEl.textContent = score;
  speedEl.textContent = Math.floor(speed - 4);

  draw();
  animationId = requestAnimationFrame(loop);
}

function startGame() {
  cancelAnimationFrame(animationId);
  resetGame();
  overlay.style.display = "none";
  running = true;
  lastTime = 0;
  animationId = requestAnimationFrame(loop);
}

startBtn.addEventListener("click", startGame);

document.addEventListener("keydown", e => {
  if (["ArrowLeft", "ArrowRight", "a", "A", "d", "D", " "]
      .includes(e.key)) {
    e.preventDefault();
  }

  if (e.key === "ArrowLeft" || e.key.toLowerCase() === "a")
    keys.left = true;

  if (e.key === "ArrowRight" || e.key.toLowerCase() === "d")
    keys.right = true;

  if (e.key === " " && !running) startGame();
});

document.addEventListener("keyup", e => {
  if (e.key === "ArrowLeft" || e.key.toLowerCase() === "a")
    keys.left = false;

  if (e.key === "ArrowRight" || e.key.toLowerCase() === "d")
    keys.right = false;
});

// Mobile and mouse controls
function holdButton(button, direction) {
  const down = e => {
    e.preventDefault();
    keys[direction] = true;
  };

  const up = () => { keys[direction] = false; };

  button.addEventListener("pointerdown", down);
  button.addEventListener("pointerup", up);
  button.addEventListener("pointerleave", up);
  button.addEventListener("pointercancel", up);
}

holdButton(document.getElementById("left"), "left");
holdButton(document.getElementById("right"), "right");

resetGame();
draw();
</script>
</body>
</html>
